<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>덕장 차트</title>
<!-- lightweight-charts 4.x
     ※ 지시서는 cdnjs를 지정했으나 cdnjs에는 이 라이브러리가 존재하지 않는다
       (api.cdnjs.com -> "Library not found", 실측 2026-07-28).
       검증된 jsdelivr을 주 소스로, unpkg를 폴백으로 사용한다. -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  if (typeof LightweightCharts === "undefined") {
    document.write('<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#0d1117; --panel:#131a24; --border:#243040; --text:#e6edf3;
    --muted:#8b98a9; --up:#e2445c; --down:#3b82f6; --accent:#2dd4bf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--border);background:var(--panel);
         position:sticky;top:0;z-index:50;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
  .searchbox{position:relative;flex:1;min-width:220px;max-width:380px}
  #q{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
     background:#0b0f16;color:var(--text);font-size:14px;outline:none}
  #q:focus{border-color:var(--accent)}
  #dropdown{position:absolute;top:110%;left:0;right:0;background:var(--panel);
            border:1px solid var(--border);border-radius:8px;max-height:320px;
            overflow-y:auto;display:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #dropdown div{padding:9px 12px;cursor:pointer;font-size:13px;display:flex;
                justify-content:space-between;gap:10px}
  #dropdown div:hover{background:#1b2432}
  .mk{color:var(--muted);font-size:11px}
  #meta{font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #meta b{color:var(--text);font-size:15px}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)}
  #banner{display:none;padding:8px 18px;background:#3b2a12;color:#f5c77e;
          font-size:12.5px;border-bottom:1px solid #5a4320}
  /* 로딩 진행률. 패널이 반쯤 빈 상태를 보여주는 대신 여기서 퍼센트를 알린다 */
  #loading{display:none;padding:8px 18px;background:#12263a;color:#7dd3fc;
           font-size:12.5px;border-bottom:1px solid #1e4560;font-weight:600}
  main{padding:10px 14px 40px; margin-right:372px}
  @media (max-width:1100px){ main{margin-right:0} #side{position:static;width:auto;height:auto} }
  #side{position:fixed; right:0; top:0; width:360px; height:100vh; overflow-y:auto;
        background:var(--panel); border-left:1px solid var(--border); padding:12px;
        z-index:40; font-size:12px}
  #side h3{font-size:12.5px;margin:0 0 8px;color:var(--text);font-weight:600;
           display:flex;justify-content:space-between;align-items:center;gap:6px}
  #side .sub{color:var(--muted);font-size:11px;font-weight:400}
  #est-table{width:100%;border-collapse:collapse;font-size:11px}
  #est-table th,#est-table td{padding:6px 8px;text-align:right;border-bottom:1px solid #1b2432;
                              white-space:nowrap}
  #est-table th{color:var(--muted);font-weight:500}
  #est-table td:first-child,#est-table th:first-child{text-align:left}
  #est-table tr.est{background:rgba(45,212,191,.07)}
  #est-table tr.est td:first-child{color:var(--accent);font-weight:600}
  #mtf-table{width:100%;border-collapse:collapse;font-size:11px}
  #mtf-table th,#mtf-table td{padding:7px 9px;text-align:right;border-bottom:1px solid #1b2432;white-space:nowrap}
  #mtf-table th{color:var(--muted);font-weight:500}
  #mtf-table td:first-child,#mtf-table th:first-child{text-align:left;font-weight:600}
  .vd{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:600}
  .vd.bull{background:#0f3f33;color:#4ade80}
  .vd.bear{background:#3f1620;color:#f87171}
  .vd.flat{background:#26303f;color:#9aa7b8}
  .btngroup{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden}
  .tfb,.pdb,.bm,.bb,.by,.brb{background:#0e131c;color:var(--muted);border:0;padding:3px 8px;
              font-size:11px;cursor:pointer;font-family:inherit}
  .tfb+.tfb,.pdb+.pdb,.bm+.bm,.bb+.bb,.by+.by,.brb+.brb{border-left:1px solid var(--border)}
  .tfb.on,.pdb.on,.bm.on,.bb.on,.by.on,.brb.on{background:var(--accent);color:#06231f;font-weight:600}
  .tfb:hover:not(.on),.pdb:hover:not(.on),.bm:hover:not(.on),.bb:hover:not(.on),.by:hover:not(.on),.brb:hover:not(.on){background:#1b2432;color:var(--text)}
  #sig-table{width:100%;border-collapse:collapse;font-size:11px}
  #sig-table td,#sig-table th{padding:7px 10px;border-bottom:1px solid #1b2432;white-space:nowrap}
  #sig-table th{color:var(--muted);font-weight:500;text-align:right}
  #sig-table td:first-child,#sig-table th:first-child{text-align:left;font-weight:600}
  #sig-table td:not(:first-child){text-align:right}
  .tip{position:absolute;display:none;pointer-events:none;z-index:80;
       background:rgba(13,17,23,.96);border:1px solid var(--border);border-radius:6px;
       padding:6px 9px;font-size:11.5px;line-height:1.5;white-space:nowrap;
       box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .tip b{color:var(--text)} .tip .k{color:var(--muted);margin-right:6px}
  .lamp{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
  .lamp.green{background:#22c55e;box-shadow:0 0 6px #22c55e88}
  .lamp.yellow{background:#facc15;box-shadow:0 0 6px #facc1588}
  .lamp.red{background:#f87171;box-shadow:0 0 6px #f8717188}
  .sechead{color:var(--muted);font-size:10.5px;margin:12px 0 5px;
         letter-spacing:.2px;font-weight:600}
  #sig-table td:last-child,#sig-table th:last-child{width:26px;text-align:center}
  #sig-table{table-layout:auto}
  #side h3{margin:0 0 10px}
  .up{color:#f87171} .dn{color:#60a5fa}
  .op{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
  .op.buy{background:#0f3f33;color:#4ade80} .op.hold{background:#3a3320;color:#f0c674}
  .warn{margin-top:8px;padding:7px 8px;border-radius:6px;background:#3b2a12;
        color:#f5c77e;font-size:10.5px;line-height:1.45}
  .muted-note{color:var(--muted);font-size:10.5px;margin-top:6px;line-height:1.4}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         margin-bottom:10px;overflow:hidden}
  .ptitle{font-size:12px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--border);
          display:flex;justify-content:space-between;align-items:center}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}
  .legend i{display:inline-block;width:9px;height:2.5px;vertical-align:middle;margin-right:4px}
  .off{opacity:.45}
  #patterns{font-size:11.5px;color:var(--muted);padding:0 4px 6px}
  .tag{display:inline-block;background:#1b2432;border:1px solid var(--border);
       border-radius:5px;padding:2px 7px;margin:3px 4px 0 0;color:#c9d4e2}
  /* Bulkowski 패턴 (chart_patterns) — ACP 13종과 섞이지 않게 별도 줄로 */
  #bulk{font-size:11.5px;padding:0 4px 8px;border-top:1px solid var(--border);margin-top:2px}
  #bulk .bhead{color:var(--muted);padding:6px 0 1px 2px}
  .btag{display:inline-flex;align-items:center;gap:6px;background:#1b2432;
        border:1px solid var(--border);border-radius:6px;padding:3px 8px;
        margin:3px 4px 0 0;color:#c9d4e2;cursor:pointer;user-select:none}
  .btag:hover{border-color:#5b6b80}
  .btag.sel{border-color:#f5c77e;background:#2b2718}
  .btag .dir{font-weight:700}
  .btag .dir.up{color:#e2445c} .btag .dir.dn{color:#3b82f6}
  .btag .sc{font-variant-numeric:tabular-nums;color:#f5c77e;font-weight:600}
  .btag .st{font-size:10px;padding:0 5px;border-radius:4px;
            border:1px solid var(--border);color:#9aa5b4}
  .btag .st.bo{color:#4ade80;border-color:#17614e}
  #bulkinfo{margin-top:7px;color:var(--muted);line-height:1.7;padding-left:2px}
  #bulkinfo b{color:#c9d4e2;font-weight:600}
  #bulkinfo .warn{color:#f5c77e}
  #toggles{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
  #toggles label{font-size:11.5px;background:#1b2432;border:1px solid var(--border);
       border-radius:6px;padding:4px 9px;cursor:pointer;user-select:none;color:#c9d4e2}
  #toggles input{margin-right:5px;vertical-align:-1px}
  #mnv{font-size:12px;padding:6px 14px 0;color:var(--muted)}
  .badge{display:inline-block;border-radius:5px;padding:2px 8px;font-weight:600;font-size:11.5px}
  .badge.ok{background:#0f3f33;color:#4ade80;border:1px solid #17614e}
  .badge.no{background:#3f1620;color:#fb7185;border:1px solid #6d2436}
/* 판정 보류(데이터 수집 중). 통과/미충족과 색으로 구분해 오독을 막는다 */
.badge.na{background:#2a2f3a;color:#9aa5b4;border:1px solid #3c4451}
  .crit{display:inline-block;margin:2px 3px 0 0;font-size:11px;padding:1px 6px;
        border-radius:4px;border:1px solid var(--border)}
  .crit.y{color:#4ade80} .crit.n{color:#fb7185} .crit.na{color:#6b7684}
</style>
</head>
<body>

<header>
  <h1>덕장 차트</h1>
  <div class="searchbox">
    <input id="q" placeholder="종목명 또는 코드 (예: 삼성전자, 005930)" autocomplete="off" />
    <div id="dropdown"></div>
  </div>
  <div id="meta"></div>
</header>

<div id="loading"></div>
<div id="banner"></div>

<div id="toggles">
  <span class="btngroup"><button class="tfb on" data-tf="D">일봉</button><button class="tfb" data-tf="W">주봉</button><button class="tfb" data-tf="M">월봉</button></span>
  <span class="btngroup"><button class="pdb" data-d="250">1년</button><button class="pdb" data-d="750">3년</button><button class="pdb on" data-d="1250">5년</button><button class="pdb" data-d="2600">10년</button><button class="pdb" data-d="5200">20년</button></span>
  <label><input type="checkbox" id="t-ma" checked>이동평균(5·10·20·50·120)</label>
  <label><input type="checkbox" id="t-bb" checked>볼린저(20,2)</label>
  <label><input type="checkbox" id="t-hma" checked>HMA(60)</label>
  <label><input type="checkbox" id="t-ich">이치모쿠(9,26,52)</label>
  <label><input type="checkbox" id="t-pat" checked>ACP 패턴</label>
  <label><input type="checkbox" id="t-bulk" checked>Bulkowski 패턴</label>
  <span class="btngroup" title="패턴의 돌파(또는 완성) 시점을 최근 몇 봉까지 인정할지"><button class="brb" data-r="10">10봉</button><button class="brb" data-r="20">20봉</button><button class="brb on" data-r="60">60봉</button><button class="brb" data-r="150">150봉</button></span>
  <label><input type="checkbox" id="t-sr" checked>S/R + 돌파</label>
  <label><input type="checkbox" id="t-ob">오더블록</label>
  <label><input type="checkbox" id="t-div" checked>RSI 다이버전스</label>
</div>
<div id="mnv"></div>

<main>
  <div class="panel">
    <div class="ptitle">
      <span>가격 · 이동평균 · 볼린저 · 패턴</span>
      <span class="legend">
        <span style="color:#f0b90b"><i style="background:#f0b90b"></i>MA20</span>
        <span style="color:#9b6dff"><i style="background:#9b6dff"></i>MA50</span>
        <span style="color:#26a69a"><i style="background:#26a69a"></i>MA120</span>
        <span style="color:#5d6d7e"><i style="background:#5d6d7e"></i>BB(20,2)</span>
      </span>
    </div>
    <div id="main-chart" style="height:420px"></div>
    <div id="patterns"></div>
    <div id="bulk"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>거래량</span></div>
    <div id="vol-chart" style="height:110px"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>RSI(14) · Bear 다이버전스 ▼</span></div>
    <div id="rsi-chart" style="height:140px"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>스퀴즈 모멘텀 (LazyBear)</span></div>
    <div id="sqz-chart" style="height:140px"></div>
  </div>

  <div class="panel" id="aa-panel">
    <div class="ptitle"><span>스퀴즈 모멘텀 (AlgoAlpha)</span><span id="aa-note" class="mk"></span></div>
    <div id="aa-chart" style="height:150px"></div>
  </div>

  <div class="panel" id="flow-panel">
    <div class="ptitle"><span>수급 — 외국인 순매수</span><span id="flow-note" class="mk"></span></div>
    <div id="flow-chart" style="height:150px"></div>
  </div>

  <div class="panel" id="band-panel">
    <div class="ptitle">
      <span>역사적 밸류에이션 밴드
        <span class="btngroup" style="margin-left:8px">
          <button class="bm on" data-m="PER">PER</button><button class="bm" data-m="PBR">PBR</button><button class="bm" data-m="POR">POR</button><button class="bm" data-m="ROE">ROE</button>
        </span>
        <span class="btngroup" style="margin-left:6px">
          <button class="bb on" data-b="FY">FY확정</button><button class="bb" data-b="LTM">LTM</button>
        </span>
      </span>
      <span id="band-note" class="mk"></span>
    </div>
    <div id="band-chart" style="height:200px;position:relative">
      <div class="tip" id="band-tip"></div>
    </div>
  </div>

  <div class="panel" id="short-panel">
    <div class="ptitle"><span>공매도 잔고 (수량 / 비중%)</span><span id="short-note" class="mk"></span></div>
    <div id="short-chart" style="height:140px"></div>
  </div>
</main>

<aside id="side">
  <h3>신호등 <span class="sub" id="sig-meta"></span></h3>
  <div id="sig-body"><div class="muted-note">종목을 선택하세요</div></div>
  <div style="height:14px"></div>
  <h3>멀티타임프레임 <span class="sub" id="mtf-meta"></span></h3>
  <div id="mtf-body"><div class="muted-note">불러오는 중…</div></div>
  <div style="height:14px"></div>
  <h3>포워드 컨센서스 <span class="sub" id="est-meta"></span></h3>
  <div id="est-body"><div class="muted-note">불러오는 중…</div></div>
</aside>

<script>
// ===== EMS 주소 주입 =====
const API_BASE = window.location.origin;   // 예: "http://ems.example.com"

const $ = (s) => document.querySelector(s);
const banner = $("#banner");
function showBanner(msg){ banner.textContent = msg; banner.style.display = "block"; }
function hideBanner(){ banner.style.display = "none"; }

const COMMON = {
  layout:{ background:{ color:"#131a24" }, textColor:"#8b98a9", fontSize:11 },
  grid:{ vertLines:{ color:"#1b2432" }, horzLines:{ color:"#1b2432" } },
  rightPriceScale:{ borderColor:"#243040" },
  timeScale:{ borderColor:"#243040", rightOffset:6 },
  crosshair:{ mode:0 },
};

const mainChart = LightweightCharts.createChart($("#main-chart"), {...COMMON, height:420});
const volChart  = LightweightCharts.createChart($("#vol-chart"),  {...COMMON, height:110});
const rsiChart  = LightweightCharts.createChart($("#rsi-chart"),  {...COMMON, height:140});
const sqzChart  = LightweightCharts.createChart($("#sqz-chart"),  {...COMMON, height:140});
const aaChart = LightweightCharts.createChart($("#aa-chart"), {...COMMON, height:150});
const flowChart = LightweightCharts.createChart($("#flow-chart"), {...COMMON, height:150});
const shortChart = LightweightCharts.createChart($("#short-chart"), {...COMMON, height:140});
// 밴드는 회계 기준 시계열이라 다른 패널과 시간축을 공유하지 않는다
const bandChart = LightweightCharts.createChart($("#band-chart"), {...COMMON, height:200});

// 밴드 위에 마우스를 올리면 그 시점 값 + 평균 대비 위치를 띄운다.
// (기존엔 오른쪽 축 라벨만 있어서 특정 시점 값을 읽을 수 없었다)
let BAND_STATS = null;   // renderBand 가 채운다: {mean, sd, unit}
bandChart.subscribeCrosshairMove(p => {
  const tip = $("#band-tip"), box = $("#band-chart");
  if (!p || !p.time || !p.point || p.point.x < 0 || p.point.y < 0){
    tip.style.display = "none"; return;
  }
  // 1순위: 크로스헤어가 넘겨준 시리즈 값
  let val = null;
  const v = p.seriesData && p.seriesData.get(bandLine);
  if (v != null) val = (typeof v === "object") ? v.value : v;
  // 2순위: 시간으로 원본에서 직접 찾기 (seriesData 가 비는 경우 대비)
  if (val == null){
    const d = BAND_CACHE[(CUR_TICKER||"") + "|" + BAND_B];
    const arr = d && d.available && d.series[BAND_M];
    if (arr){
      const hit = arr.find(x => x[0] === p.time);
      if (hit) val = hit[1];
    }
  }
  if (val == null){ tip.style.display = "none"; return; }

  const s = BAND_STATS || {};
  const z = (s.sd ? (val - s.mean) / s.sd : null);
  const zc = z == null ? "var(--muted)" : (z > 1 ? "#f87171" : (z < -1 ? "#4ade80" : "#8b98a9"));
  tip.innerHTML =
    `<div><b>${p.time}</b></div>` +
    `<div><span class="k">${BAND_M}</span><b>${val.toFixed(2)}${s.unit || ""}</b></div>` +
    (s.mean != null ? `<div><span class="k">평균</span>${s.mean.toFixed(2)}` +
      (z != null ? ` <b style="color:${zc}">(${z >= 0 ? "+" : ""}${z.toFixed(1)}σ)</b>` : "") + `</div>` : "");

  tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = p.point.x + 14, y = p.point.y - h - 10;
  if (x + w > box.clientWidth) x = p.point.x - w - 14;   // 오른쪽 끝에서 뒤집기
  if (y < 0) y = p.point.y + 14;
  tip.style.left = Math.max(0, x) + "px";
  tip.style.top = Math.max(0, y) + "px";
});
const CHARTS = [mainChart, volChart, rsiChart, sqzChart, aaChart, flowChart, shortChart];

// 시리즈
// ⚠️ 패턴 구름대는 캔들보다 **먼저** 만들어야 한다.
// lightweight-charts 는 시리즈를 추가한 순서대로 그리므로, 캔들 뒤에 깔리려면
// 여기서 미리 풀을 잡아두고 나중에 setData 로 채우는 수밖에 없다
// (동적으로 addSeries 하면 항상 캔들 위에 얹혀 캔들이 가려진다).
// 히스토그램은 base~value 사이를 칠하므로, base=구간저가 / value=구간고가 로
// 두면 패턴 구간이 통째로 음영 사각형이 된다.
const BULK_CLOUD_MAX = 14;
const bulkClouds = Array.from({length: BULK_CLOUD_MAX}, () =>
  mainChart.addHistogramSeries({
    priceScaleId: "right", base: 0, color: "rgba(0,0,0,0)",
    priceLineVisible: false, lastValueVisible: false,
  }));

const candle = mainChart.addCandlestickSeries({
  upColor:"#e2445c", downColor:"#3b82f6", borderVisible:false,
  wickUpColor:"#e2445c", wickDownColor:"#3b82f6",
});
const mkLine = (o) => mainChart.addLineSeries(

// 시간축 동기화
// SYNC_LOGICAL 은 가격 차트와 봉 수가 같아 논리 인덱스로 묶어도 안전하다.
// SYNC_TIME 은 봉 수가 다르므로 반드시 '시간' 기준으로 맞춘다.
//   - 밴드: 최대 15년치를 받아둔다(가격 1250봉 vs 밴드 2500여봉)
//   - 공매도: KRX 가 약 2년만 준다(가격 1250봉 vs 공매도 440봉)
// ⚠️ 봉 수가 다른 차트에 setVisibleLogicalRange 를 걸면 인덱스 0~1250 을 440봉
//    차트에 강제해 데이터가 한쪽으로 쏠린다. 5년/10년 차트에서 공매도 패널이
//    깨져 보인 원인이 이것이었다.
// 전 패널을 '시간' 기준으로 묶는다. 논리 인덱스(봉 번호)로 묶으면 안 된다 —
// 패널마다 시리즈 길이가 다르기 때문이다(실측 005930, 5년):
//   가격/거래량 1250봉 · 공매도 440봉(KRX 2년 한도)
//   RSI·스퀴즈·AlgoAlpha 는 워밍업 구간이 빠져 시작 인덱스가 14·38·29봉씩 밀린다
// 그래서 인덱스 0~1250 을 그대로 넘기면 짧은 패널은 데이터가 한쪽으로 쏠리고,
// 워밍업이 있는 패널은 같은 인덱스가 다른 날짜를 가리켜 조용히 어긋난다.
// 시간축은 모든 패널의 공통 좌표라 길이가 달라도 정렬이 깨지지 않는다.
// 발신은 가격 패널(CHARTS)만, 수신은 밴드까지 포함해 단방향으로 둔다.
// 밴드까지 발신하게 하면 renderBand 의 fitContent 가 가격 차트 구간을 덮어써
// 서로 구간을 밀어내며 튄다(원래 코드 주석이 경고한 그 문제).
const SYNC_TARGETS = CHARTS.concat([bandChart]);

  c.timeScale().subscribeVisibleTimeRangeChange((t) => {
    if (syncing || !t) return;
    syncing = true;
    SYNC_TARGETS.forEach((o) => {
      if (o !== c) { try { o.timeScale().setVisibleRange(t); } catch(e){} }
    });
    syncing = false;

});

// 동적 시리즈 (패턴 추세선 / 오더블록 박스)
let patternSeries = [], obSeries = [];
let CUR_TICKER = null;
// 기본 5년. 금리 인상/인하 사이클이 대략 2년 주기라 3년은 한 사이클을 겨우 담고
// 비교 구간이 남지 않는다. 5년이면 사이클 두 번이 들어온다.
let PERIOD = 1250;  // 서버에서 받아올 일봉 수 (기본 5년)
let TF = "D";       // D=일봉 W=주봉 M=월봉 (재집계는 서버가 담당)
function clearDynamic(list){
  list.forEach((s) => { try { mainChart.removeSeries(s); } catch(e){} });
  list.length = 0;
}

// ---- Bulkowski 패턴 (chart_patterns) ----------------------------------
// 외곽선은 감지된 것을 전부 그리되, 트리거/목표 가격선은 '선택된 하나'에만 붙인다.
// 히트가 10건 넘는 종목이 드물지 않아서 전부 그리면 가격축이 라벨로 덮인다.
let bulkSeries = [], bulkLines = [], BULK = null, BULK_SEL = 0, BULK_RECENT = 60;

function clearBulkLines(){
  bulkLines.forEach((l) => { try { candle.removePriceLine(l); } catch(e){} });
  bulkLines.length = 0;
}

const fmtPx = (v) => (v === null || v === undefined) ? "-"
  : (Math.abs(v) >= 1000 ? Math.round(v).toLocaleString() : (+v).toFixed(2));
const pct = (v) => (v === null || v === undefined) ? "-"
  : (v > 0 ? "+" : "") + (+v).toFixed(1) + "%";

// 측정룰(패턴 높이를 통째로 투영)은 키 큰 패턴에서 현재가 대비 ±70% 같은
// 목표를 낸다. 그런 선은 정보가 없을뿐더러 가격축을 망가뜨릴 수 있으므로
// 화면 데이터 범위를 크게 벗어나면 선은 생략하고 숫자만 알린다.
function inChartRange(price){
  if (!LAST || price === null || price === undefined) return false;
  const o = LAST.ohlcv;
  const lo = Math.min(...o.low), hi = Math.max(...o.high);
  const pad = (hi - lo) * 0.35;
  return price >= lo - pad && price <= hi + pad;
}

function drawBulkowski(){
  clearDynamic(bulkSeries);
  clearBulkLines();
  const box = $("#bulk"), b = BULK;
  if (!b || !b.available){
    box.innerHTML = (b && b.reason)
      ? `<div class="bhead">Bulkowski 패턴 — <span class="warn">${b.reason}</span></div>` : "";
    return;
  }
  const hits = b.hits || [];
  if (!hits.length){
    box.innerHTML = `<div class="bhead">Bulkowski 패턴 — 최근 ${b.recent}봉 내 감지 없음 `
                  + `<span class="mk">(73패턴 탐색 · 국면 ${b.regime})</span></div>`;
    return;
  }
  if (BULK_SEL >= hits.length) BULK_SEL = 0;
  const vis = $("#t-bulk").checked;

  // 구름대 — 패턴 구간을 캔들 뒤에 음영으로 깔아 형태가 눈에 들어오게 한다.
  // 풀은 고정이므로 지우는 건 removeSeries 가 아니라 빈 데이터다.
  // 구름은 **선택된 패턴에만** 깐다. 히트가 9건씩 나오는 종목에서 전부 칠하면
  // 같은 구간에 음영이 겹겹이 쌓여(0.06 × 9) 얼룩만 남고 형태가 오히려 묻힌다.
  // 나머지 패턴은 점선 외곽선으로 위치만 알리고, 태그를 누르면 구름이 옮겨간다.
  bulkClouds.forEach(s => s.setData([]));
  if (vis) {
    const O = LAST.ohlcv;
    hits.slice(0, BULK_CLOUD_MAX).forEach((h, i) => {
      if (i !== BULK_SEL) return;
      // 구간에 걸치는 봉만 칠한다. 주봉 스케일 패턴의 start/end 도 실제 거래일
      // 이라 문자열 비교(ISO 날짜)로 그대로 걸러진다.
      const idx = [];
      for (let k = 0; k < O.dates.length; k++)
        if (O.dates[k] >= h.start && O.dates[k] <= h.end) idx.push(k);
      if (idx.length < 2) return;
      // 높이는 꼭짓점이 아니라 구간의 실제 고가~저가로 잡는다. 혼/파이프처럼
      // 꼭짓점 2개가 같은 높이인 패턴은 점만 쓰면 밴드가 납작해져 안 보인다.
      let top = -Infinity, bot = Infinity;
      idx.forEach(k => { if (O.high[k] > top) top = O.high[k];
                         if (O.low[k] < bot) bot = O.low[k]; });
      if (!(top > bot)) return;
      const pad = (top - bot) * 0.04;         // 캔들 꼬리가 구름 밖으로 새지 않게
      top += pad; bot -= pad;
      const rgb = h.direction === "up" ? "226,68,92" : "59,130,246";
      bulkClouds[i].applyOptions({base: bot, color: `rgba(${rgb},0.16)`});
      bulkClouds[i].setData(idx.map(k => ({time: O.dates[k], value: top})));
    });
  }

  // 외곽선 — 방향색. 선택된 것만 실선·굵게, 나머지는 점선으로 죽인다.
  hits.forEach((h, i) => {
    const pts = (h.points || []).filter(p => p[0]);
    if (pts.length < 2) return;
    const sel = (i === BULK_SEL);
    const s = mkLine({color: h.direction === "up" ? "#e2445c" : "#3b82f6",
                      lineWidth: sel ? 2 : 1, lineStyle: sel ? 0 : 2});
    s.setData(pts.map(p => ({time: p[0], value: p[1]})));
    s.applyOptions({visible: vis});
    bulkSeries.push(s);
  });

  const h = hits[BULK_SEL];
  const tgtOff = (h.target !== null && h.target !== undefined) && !inChartRange(h.target);
  if (vis){
    if (h.trigger) bulkLines.push(candle.createPriceLine({
      price: h.trigger, color: "#f5c77e", lineWidth: 1, lineStyle: 2,
      axisLabelVisible: true, title: "트리거"}));
    if (h.target && !tgtOff) bulkLines.push(candle.createPriceLine({
      price: h.target, color: "#a78bfa", lineWidth: 1, lineStyle: 3,
      axisLabelVisible: true, title: "목표"}));
  }

  const tags = hits.map((x, i) => {
    const up = x.direction === "up";
    const bo = x.status === "breakout";
    return `<span class="btag${i === BULK_SEL ? " sel" : ""}" data-i="${i}">`
         + `<span class="dir ${up ? "up" : "dn"}">${up ? "▲" : "▼"}</span>`
         + `${x.name_kr}${x.scale === "W" ? '<span class="mk">주봉</span>' : ""}`
         + `<span class="st${bo ? " bo" : ""}">${bo ? "돌파" : "형성중"}</span>`
         + `<span class="sc">${x.score.toFixed(0)}</span></span>`;
  }).join("");

  const bk = h.book || {};
  const regimeKr = bk.regime === "bear" ? "약세장" : "강세장";
  const dirKr = h.direction === "up" ? "상승돌파" : "하락돌파";
  const bookLine = (bk.perf === null || bk.perf === undefined)
    ? `책 통계 없음 <span class="mk">(갭·깃발 등 성과표 미수록 패턴)</span>`
    : `책 통계(${regimeKr}·${dirKr}) 평균 <b>${pct(bk.perf)}</b>`
      + ` · 손익분기 실패율 <b>${bk.fail === null ? "-" : bk.fail.toFixed(1) + "%"}</b>`
      + ` · 순위 <b>${bk.rank === null ? "-" : bk.rank + "위"}</b>`;

  const bits = [];
  if (h.trigger) bits.push(`트리거 <b>${fmtPx(h.trigger)}</b>`
    + (h.to_trigger_pct !== null && h.to_trigger_pct !== undefined
       ? ` <span class="mk">(현재가 대비 ${pct(h.to_trigger_pct)})</span>` : ""));
  if (h.breakout_date) bits.push(`돌파 <b>${h.breakout_date}</b> @${fmtPx(h.breakout_px)}`
    + ` <span class="mk">(이후 ${pct(h.since_breakout_pct)})</span>`);
  if (h.target) bits.push(`목표 <b>${fmtPx(h.target)}</b> <span class="mk">(${pct(h.upside_pct)})</span>`
    + (tgtOff ? ` <span class="warn">— 측정룰 값이 차트 범위 밖이라 선은 생략</span>` : ""));
  if (h.back_inside) bits.push(`<span class="warn">되돌림 — 돌파선 안으로 복귀</span>`);
  if (h.target_reached) bits.push(`<span class="warn">목표가 이미 도달</span>`);

  box.innerHTML = `<div class="bhead">Bulkowski 패턴 `
      + `<span class="mk">73패턴 · 최근 ${b.recent}봉 · ${hits.length}건 · 국면 ${b.regime}</span></div>`
    + tags
    + `<div id="bulkinfo">`
    + `<b>${h.name_kr}</b> <span class="mk">${h.name_en}</span> · ${h.start}~${h.end}`
    + ` <span class="mk">(${h.bars}봉 · 높이 ${h.height_pct}%)</span><br>`
    + (bits.length ? bits.join(" · ") + "<br>" : "")
    + bookLine
    + ` · 형태적합 <b>${h.quality}</b>`
    + ` · 거래량 ${h.vol_conforms ? "책과 일치" : "불일치"}`
    + ` · 종합 <b>${h.score}</b>점`
    + `</div>`;

  box.querySelectorAll(".btag").forEach(el => el.addEventListener("click", () => {
    BULK_SEL = +el.dataset.i;
    drawBulkowski();
    drawMarkers();
  }));
}

async function reloadBulkowski(){
  if (!CUR_TICKER) return;
  try{
    const r = await fetch(`${API_BASE}/api/chart/patterns?ticker=${CUR_TICKER}`
                        + `&days=${PERIOD}&tf=${TF}&recent=${BULK_RECENT}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    BULK = await r.json();
  }catch(e){
    BULK = {available:false, reason:`재탐지 실패: ${e.message}`, hits:[]};
  }
  BULK_SEL = 0;
  drawBulkowski();
  drawMarkers();
}

  if (!LAST) return;
  const on = (id) => $(id).checked;

  BB_SERIES.forEach(s => s.applyOptions({visible: on("#t-bb")}));

  ICH_SERIES.forEach(s => s.applyOptions({visible: on("#t-ich")}));
  SR_SERIES.forEach(s => s.applyOptions({visible: on("#t-sr")}));
  patternSeries.forEach(s => s.applyOptions({visible: on("#t-pat")}));
  obSeries.forEach(s => s.applyOptions({visible: on("#t-ob")}));
  // 가격선(트리거·목표)은 visible 옵션이 없어 껐다 켜려면 다시 만들어야 한다.
  // drawBulkowski 가 시리즈까지 통째로 다시 그리므로 여기서 한 번만 부른다.
  drawBulkowski();
  drawMarkers();
}

// 캔들 마커 = RSI 다이버전스 + S/R 돌파 (토글에 따라 합성)
function drawMarkers(){
  if (!LAST) return;
  const dates = LAST.ohlcv.dates, ind = LAST.indicators;
  let marks = [];
  if ($("#t-div").checked) {
    marks = marks.concat((ind.rsi_bear_div||[]).map(i=>({
      time:dates[i], position:"aboveBar", color:"#e2445c", shape:"arrowDown", text:"Bear"
    })));
  }
  if ($("#t-sr").checked && ind.sr) {
    marks = marks.concat((ind.sr.breaks||[]).map(b=>{
      const up = (b.type==="break_up" || b.type==="bull_wick");
      return {
        time:dates[b.index],
        position: up ? "belowBar" : "aboveBar",
        color: up ? "#22c55e" : "#e2445c",
        shape: up ? "arrowUp" : "arrowDown",
        text: b.label || "B"
      };
    }));
  }
  // Bulkowski — 선택된 패턴의 돌파 시점만. 전부 찍으면 S/R 돌파 화살표와 뒤엉킨다.
  if ($("#t-bulk").checked && BULK && BULK.available){
    const h = (BULK.hits||[])[BULK_SEL];
    if (h && h.breakout_date){
      const up = h.direction === "up";
      marks.push({time:h.breakout_date, position: up ? "belowBar" : "aboveBar",
                  color:"#f5c77e", shape: up ? "arrowUp" : "arrowDown",
                  text:`${h.name_kr} 돌파`});
    }
  }
  marks.sort((a,b)=> a.time < b.time ? -1 : 1);
  candle.setMarkers(marks);
}

["#t-ma","#t-bb","#t-hma","#t-ich","#t-pat","#t-sr","#t-ob","#t-div","#t-bulk"]
  .forEach(id => document.querySelector(id).addEventListener("change", applyToggles));

// ---- 데이터 바인딩 ----
function pairs(dates, arr){
  const out = [];
  if (!arr) return out;
  for (let i=0;i<dates.length;i++){
    if (arr[i] !== null && arr[i] !== undefined) out.push({ time: dates[i], value: arr[i] });
  }
  return out;
}

function render(d){
  LAST = d;
  const o = d.ohlcv, ind = d.indicators, dates = o.dates;

  candle.setData(dates.map((t,i)=>({
    time:t, open:o.open[i], high:o.high[i], low:o.low[i], close:o.close[i]
  })));
  ma5.setData(pairs(dates, ind.sma5));
  ma10.setData(pairs(dates, ind.sma10));
  ma20.setData(pairs(dates, ind.sma20));
  ma50.setData(pairs(dates, ind.sma50));
  ma120.setData(pairs(dates, ind.sma120));
  hma60.setData(pairs(dates, ind.hma60));
  bbU.setData(pairs(dates, ind.bb_upper));
  bbL.setData(pairs(dates, ind.bb_lower));

  // 이치모쿠
  const ich = ind.ichimoku || {};
  ichTen.setData(pairs(dates, ich.tenkan));
  ichKij.setData(pairs(dates, ich.kijun));
  ichA.setData(pairs(dates, ich.span_a));
  ichB.setData(pairs(dates, ich.span_b));
  ichChi.setData(pairs(dates, ich.chikou));

  // S/R 계단선 (LuxAlgo 원본)
  const sr = ind.sr || {};
  srHi.setData(pairs(dates, sr.resistance));
  srLo.setData(pairs(dates, sr.support));

  // 오더블록 (Flux 원본: 강세/약세 각 3개, 무효화된 존은 흐리게)
  clearDynamic(obSeries);
  const ob = ind.order_blocks || {bull:[], bear:[]};
  [...(ob.bull||[]), ...(ob.bear||[])].forEach((b)=>{
    const endIdx = Math.min(dates.length-1, b.index + 20);
    const alpha = b.broken ? .22 : .6;
    const color = b.type==="bull" ? `rgba(34,197,94,${alpha})` : `rgba(226,68,92,${alpha})`;
    [b.top, b.bottom].forEach((y)=>{
      const s = mkLine({color, lineWidth:1, lineStyle:b.broken?2:0});
      s.setData([{time:dates[b.index], value:y},{time:dates[endIdx], value:y}]);
      obSeries.push(s);
    });
  });

  // Minervini 추세 템플릿 배지
  const mv = ind.minervini && ind.minervini.latest;
  if (mv){
    const L = {
      c1_above_ma150_ma200:"종가>150·200MA", c2_ma150_above_ma200:"150MA>200MA",
      c3_ma200_rising_1m:"200MA 1개월 상승", c4_ma50_above_ma150_ma200:"50MA>150·200MA",
      c5_close_above_ma50:"종가>50MA", c6_above_52w_low_30pct:"52주저가+30%↑",
      c7_within_25pct_of_52w_high:"52주고가-25%내", c8_rs_rating_70:"RS≥70",
    };
    // 벤치마크 지수는 첫 조회에서 백그라운드로 넘긴다(45초라 화면을 붙잡지 않음).
    // 그동안 RS(c8)는 판정 불가인데, 이걸 그냥 '–'로 두면 조건 미충족처럼 읽힌다.
    // 아직 못 받은 것과 실제로 못 넘긴 것을 구분해서 표시한다.
    const rsPending = !!d.benchmark_note;
    const badge = rsPending
      ? `<span class="badge na">Minervini 판정 보류 <span class="sub">RS 지표 준비 중</span></span> `
      : `<span class="badge ${mv.pass?'ok':'no'}">Minervini 추세템플릿 ${mv.pass?'통과':'미충족'}</span> `;
    $("#mnv").innerHTML = badge +
      Object.keys(L).map(k=>{
        const v = mv[k];
        if (k === "c8_rs_rating_70" && rsPending)
          return `<span class="crit na">⏳ ${L[k]} 준비 중</span>`;
        const cls = v===true?"y":(v===false?"n":"na");
        return `<span class="crit ${cls}">${v===true?"✓":(v===false?"✗":"–")} ${L[k]}</span>`;
      }).join("") +
      ` <span class="mk">52주저가 ${mv.pct_above_52w_low?.toFixed(0)}% / 고가 ${mv.pct_below_52w_high?.toFixed(0)}%</span>` +
      (rsPending ? ` <span class="mk">지수 수집 중 — 잠시 후 다시 조회하면 RS 까지 판정됩니다</span>` : "");
  } else { $("#mnv").innerHTML = ""; }

  volSeries.setData(dates.map((t,i)=>({
    time:t, value:o.volume[i],
    color: o.close[i] >= o.open[i] ? "rgba(226,68,92,.55)" : "rgba(59,130,246,.55)"
  })));

  rsiSeries.setData(pairs(dates, ind.rsi));

  const sq = ind.squeeze || {val:[],color:[]};
  sqzSeries.setData(dates.map((t,i)=>(
    sq.val[i]===null||sq.val[i]===undefined ? {time:t} :
    {time:t, value:sq.val[i], color:sq.color[i] || "#5d6d7e"}
  )).filter(x=>x.value!==undefined));

  // 패턴 추세선 (MA20 노란색과 겹치지 않게 별도 색상)
  clearDynamic(patternSeries);
  (ind.patterns||[]).forEach((p)=>{
    [["upper","#ff7ac6"],["lower","#7dd3fc"]].forEach(([k,color])=>{
      const ln = p[k];
      const s = mkLine({color, lineWidth:1, lineStyle:2});
      s.setData([{time:dates[ln.x1], value:ln.y1},{time:dates[ln.x2], value:ln.y2}]);
      patternSeries.push(s);
    });
  });
  $("#patterns").innerHTML = (ind.patterns||[]).length
    ? (ind.patterns||[]).map(p=>`<span class="tag">${p.name} <span class="mk">${dates[p.start]}~${dates[p.end]}</span></span>`).join("")
    : `<span class="mk">감지된 패턴 없음</span>`;

  // Bulkowski 패턴 — /full 에 기본 구간(60봉)으로 같이 실려 온다.
  // 실제로 그리는 건 render 끝의 applyToggles() 다. 사용자가 구간 버튼을
  // 바꿔둔 상태라면 그 구간으로 다시 탐지한다(응답이 오면 알아서 다시 그린다).
  BULK = d.bulkowski || null;
  BULK_SEL = 0;
  if (BULK && BULK.available && BULK.recent !== BULK_RECENT) reloadBulkowski();

  // 수급
  const tr = d.trading || {available:false};
  if (tr.available && tr["외국인"]){
    $("#flow-panel").classList.remove("off");
    $("#flow-note").textContent =
      `출처 ${tr.source||"?"} · 단위 ${tr.unit||"?"} · ${tr.dates?.length||0}일` +
      (tr.note ? ` · ${tr.note}` : "");
    flowSeries.setData(tr.dates.map((t,i)=>({
      time:t, value:tr["외국인"][i],
      color: tr["외국인"][i] >= 0 ? "rgba(226,68,92,.75)" : "rgba(59,130,246,.75)"
    })));
  } else {
    $("#flow-panel").classList.add("off");
    flowSeries.setData([]);
    $("#flow-note").textContent = "비활성 — " + (tr.reason || "데이터 없음");
  }

  // 공매도 잔고
  const sh = d.shorting || {available:false};
  if (sh.available && sh.balance_qty){
    $("#short-panel").classList.remove("off");
    // KRX 공매도 잔고는 약 2년(캘린더 730일)까지만 준다. 5년·10년 차트에서는
    // 이 패널만 짧게 끝나므로 구간과 최신일을 적어 '업데이트 안 됨'으로 보이지 않게 한다.
    // 잔고는 T+2 공시라 마지막 날짜가 주가보다 2~3영업일 뒤진다.
    const sLast = sh.dates[sh.dates.length-1], sFirst = sh.dates[0];
    const pLast = o.dates[o.dates.length-1];
    $("#short-note").textContent =
      `${sh.dates.length}일 (${sFirst}~${sLast})`
      + (sLast < pLast ? ` · T+2 공시로 주가(${pLast})보다 뒤짐` : "")
      + ` · KRX 는 약 2년만 제공`;
    shortQty.setData(pairs(sh.dates, sh.balance_qty));
    shortRatio.setData(pairs(sh.dates, sh.ratio));
  } else {
    $("#short-panel").classList.add("off");
    shortQty.setData([]); shortRatio.setData([]);
    // '아직 못 받음'과 '데이터가 없음'을 구분한다. 전자는 다시 조회하면 나온다.
    const pending = /준비 중|재시도|직전 실패/.test(sh.reason || "");
    $("#short-note").textContent = pending
      ? "수집 중 — 잠시 후 다시 조회하세요"
      : "비활성 — " + (sh.reason || "데이터 없음");
  }

  // 헤더 메타
  const last = o.close[o.close.length-1], prev = o.close[o.close.length-2] ?? last;
  const chg = prev ? ((last-prev)/prev*100) : 0;
  $("#meta").innerHTML =
    `<b>${d.name ?? ""}</b> <span class="mk">${d.ticker ?? ""} · ${d.market ?? ""}</span>` +
    // 미국 종목은 달러로 표기 (원화로 찍히던 문제)
    `<span>${d.market === "US"
        ? "$" + Number(last).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})
        : Number(last).toLocaleString() + "원"}</span>` +
    `<span class="chg ${chg>=0?"up":"down"}">${chg>=0?"+":""}${chg.toFixed(2)}%</span>` +
    `<span class="mk">${o.dates[0]} ~ ${o.dates[o.dates.length-1]} (${o.dates.length}봉)</span>`;

  // AlgoAlpha 스퀴즈 패널
  const aa = ind.squeeze_aa || {};
  if (aa.vf){
    aaVf.setData(dates.map((t,i)=>(
      aa.vf[i]==null ? null : {time:t, value:aa.vf[i], color: aa.vf[i]>0 ? "#00ffbb" : "#ff1100"}
    )).filter(Boolean));
    aaZ.setData(pairs(dates, aa.zscore));
    // 스퀴즈 상태: hyper=노랑, 압축완화=주황, 그외 회색 (원본 색상 규칙)
    aaSq.setData(dates.map((t,i)=>{
      if (aa.squeeze_val[i]==null) return null;
      const relax = (aa.squeeze_ma[i]!=null) && (aa.squeeze_ma[i]-aa.squeeze_val[i] < 0);
      return {time:t, value:2,
              color: aa.hyper[i] ? "#facc15" : (relax ? "#fb923c" : "#5d6d7e")};
    }).filter(Boolean));
    const hy = aa.hyper.filter(Boolean).length;
    $("#aa-note").textContent = `하이퍼스퀴즈 ${hy}회 · z=${aa.zscore.at(-1)==null?"-":aa.zscore.at(-1).toFixed(0)}`;
  }

  renderEstimates(d.estimates, o.close[o.close.length-1]);
  CUR_TICKER = d.ticker;
  loadMTF(d.ticker);       // 분봉은 별도 호출 (일봉 렌더를 막지 않도록 비동기)
  loadSignals(d.ticker);
  loadBands(d.ticker);
  applyToggles();          // 마커 + 시리즈 표시상태 일괄 적용
  mainChart.timeScale().fitContent();
}

// ---- 밸류에이션 밴드 ----
let BAND_M = "PER", BAND_B = "FY", BAND_CACHE = {};   // 기간은 상단 버튼(PERIOD)을 따른다
const bandLine = bandChart.addLineSeries({color:"#38bdf8", lineWidth:2, priceLineVisible:false});
const bandRefs = ["#f0b90b","#8b97a8","#8b97a8","#5d6d7e","#5d6d7e"].map((c,i)=>
  bandChart.addLineSeries({color:c, lineWidth:1, lineStyle:i===0?0:(i<3?2:3),
    priceLineVisible:false, lastValueVisible:i===0}));
const bandFwd = bandChart.addLineSeries({color:"#4ade80", lineWidth:2, lineStyle:1,
  priceLineVisible:false, lastValueVisible:true});

async function loadBands(ticker){
  const note = $("#band-note");
  const ck = ticker + "|" + BAND_B;
  if(!BAND_CACHE[ck]){
    note.textContent = "불러오는 중… (최초 1회는 시총 수집으로 40초 정도)";
    try{
      const r = await fetch(`${API_BASE}/api/chart/bands?ticker=${ticker}&basis=${BAND_B}`);
      BAND_CACHE[ck] = r.ok ? await r.json() : {available:false, reason:"HTTP "+r.status};
    }catch(e){ BAND_CACHE[ck] = {available:false, reason:e.message}; }
  }
  renderBand();
  progStep("bands");
}

function renderBand(){
  const note = $("#band-note");
  const d = BAND_CACHE[(CUR_TICKER||"") + "|" + BAND_B];
  const clear = () => { bandLine.setData([]); bandFwd.setData([]); bandRefs.forEach(s=>s.setData([])); };
  if(!d || !d.available){ clear(); note.textContent = d ? (d.reason||"데이터 없음") : ""; return; }

  let pts = (d.series[BAND_M]||[]).map(x=>({time:x[0], value:x[1]}));
  if(!pts.length){ clear(); note.textContent = `${BAND_M} 산출 불가 (적자 등)`; return; }

  // 기간은 상단 버튼(가격 차트)을 그대로 따른다.
  // 밴드에 별도 기간 버튼을 두고 표시구간만 맞추려 했더니 데이터 길이가 달라
  // 동기화가 어긋났다. 아예 같은 날짜 구간으로 잘라 두면 구조적으로 맞는다.
  const pd = LAST && LAST.ohlcv && LAST.ohlcv.dates;
  if (pd && pd.length){
    const from = pd[0], to = pd[pd.length-1];
    const cut = pts.filter(p => p.time >= from && p.time <= to);
    if (cut.length >= 2) pts = cut;
  }
  bandLine.setData(pts);

  const vals = pts.map(p=>p.value);
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
  const t0 = pts[0].time, t1 = pts[pts.length-1].time;
  [mean, mean+sd, mean-sd, mean+2*sd, mean-2*sd].forEach((lv,i)=>
    bandRefs[i].setData([{time:t0,value:lv},{time:t1,value:lv}]));

  // 포워드 배수를 수평선으로 얹어 현재 밸류가 역사 어디쯤인지 보이게 한다
  let fwdTxt = "";
  const fw = d.forward;
  if(fw && (BAND_M==="PER"||BAND_M==="POR"||BAND_M==="PBR")){
    const r0 = fw.rows.find(r=>r[BAND_M]!=null);
    if(r0){
      bandFwd.setData([{time:t0,value:r0[BAND_M]},{time:t1,value:r0[BAND_M]}]);
      const fz = sd ? (r0[BAND_M]-mean)/sd : 0;
      fwdTxt = ` · <span style="color:#4ade80">FWD ${r0.period} ${r0[BAND_M].toFixed(2)} (${fz>=0?'+':''}${fz.toFixed(1)}σ)</span>`;
    } else bandFwd.setData([]);
  } else bandFwd.setData([]);

  BAND_STATS = {mean, sd, unit: (BAND_M === "ROE" ? "%" : "배")};   // 툴팁용

  const cur = vals[vals.length-1];
  const z = sd ? (cur-mean)/sd : 0;
  const pct = vals.filter(v=>v<=cur).length/vals.length*100;
  // 평균·σ 는 '표시 중인 구간'으로만 계산된다. 종목에 따라 재무·발행주식수가
  // 늦게 시작해 가격 차트보다 짧아지는데(실측: 5년 차트에서 밴드 2.3년),
  // 구간을 안 적어두면 짧은 표본의 평균이 장기 평균처럼 읽힌다.
  const yrs = (new Date(t1) - new Date(t0)) / (365.25*24*3600*1000);
  const shortSpan = yrs < (PERIOD/252) * 0.8;
  note.innerHTML = `${d.basis} · 현재 <b>${cur.toFixed(2)}</b>${BAND_M==="ROE"?"%":"배"} · 평균 ${mean.toFixed(2)} · ` +
    `<b style="color:${z>1?'#f87171':(z<-1?'#4ade80':'#8b97a8')}">${z>=0?'+':''}${z.toFixed(1)}σ</b> · 하위 ${pct.toFixed(0)}%` + fwdTxt +
    ` <span class="mk" ${shortSpan?'style="color:#f5c77e"':''}>· 표본 ${t0}~${t1} (${yrs.toFixed(1)}년)` +
    `${shortSpan?" — 재무 시작이 늦어 차트보다 짧습니다":""}</span>`;
  // 데이터를 이미 가격 차트와 같은 날짜 구간으로 잘랐으므로 fitContent 면 겹친다.
  requestAnimationFrame(()=>bandChart.timeScale().fitContent());
}

document.querySelectorAll(".bm").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".bm").forEach(x=>x.classList.toggle("on",x===b));
  BAND_M=b.dataset.m; renderBand(); }));
document.querySelectorAll(".bb").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".bb").forEach(x=>x.classList.toggle("on",x===b));
  BAND_B=b.dataset.b; if(CUR_TICKER) loadBands(CUR_TICKER); }));

// ---- 우측: 신호등 ----
async function loadSignals(ticker){
  const body = $("#sig-body"), meta = $("#sig-meta");
  body.innerHTML = `<div class="muted-note">불러오는 중…</div>`;
  let d;
  try{
    const r = await fetch(`${API_BASE}/api/chart/signals?ticker=${ticker}&basis=${BAND_B}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    d = await r.json();
    progStep("signals");
  }catch(e){ progStep("signals"); meta.textContent=""; body.innerHTML=`<div class="muted-note">조회 실패: ${e.message}</div>`; return; }

  const lamp = c => `<span class="lamp ${c}"></span>`;
  const trend = d.frames.map(f=> f.available
    ? `<tr><td>${f.tf}</td><td>${f.passed}/${f.total}</td><td>${lamp(f.light)}</td></tr>`
    : `<tr><td>${f.tf}</td><td colspan="2" style="color:var(--muted);font-size:10px">${(f.reason||"").slice(0,20)}</td></tr>`
  ).join("");

  const v = d.valuation||{}, m = v.metrics||{};
  const val = Object.keys(m).map(k=>{
    const x=m[k];
    return `<tr><td>${k}</td><td>${x.current.toFixed(2)}</td><td>${x.z>=0?'+':''}${x.z.toFixed(1)}σ</td><td>${lamp(x.light)}</td></tr>`;
  }).join("");

  const ok = d.frames.filter(f=>f.available);
  const allGreen = ok.length && ok.every(f=>f.light==="green");
  meta.innerHTML = allGreen ? `<span class="vd bull">추세 정렬</span>` : "";

  body.innerHTML = `
    <div class="sechead">추세 (Minervini · 기간 환산)</div>
    <table id="sig-table"><tr><th>TF</th><th>조건</th><th></th></tr>${trend}</table>
    <div class="sechead">밸류에이션 (${v.basis||"-"})</div>
    ${val ? `<table id="sig-table"><tr><th>지표</th><th>현재</th><th>편차</th><th></th></tr>${val}</table>`
          : `<div class="muted-note">${(v.error||"재무 데이터 없음")}</div>`}
    <div class="muted-note">주/월봉은 MA 기간을 환산해 적용(일 50/150/200 → 주 10/30/40 → 월 3/7/10).</div>`;
}

// ---- 우측: 멀티타임프레임 ----
async function loadMTF(ticker){
  const body = $("#mtf-body"), meta = $("#mtf-meta");
  body.innerHTML = `<div class="muted-note">불러오는 중…</div>`;
  let d;
  try {
    const r = await fetch(`${API_BASE}/api/chart/mtf?ticker=${ticker}`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    d = await r.json();
    progStep("mtf");
  } catch(e){
    progStep("mtf");
    meta.textContent = "";
    body.innerHTML = `<div class="muted-note">조회 실패: ${e.message}</div>`;
    return;
  }
  const cls = v => v==="강세" ? "bull" : (v==="약세" ? "bear" : "flat");
  const rows = d.frames.map(f=>{
    if(!f.available){
      return `<tr><td>${f.tf}</td><td colspan="4" style="text-align:left;color:var(--muted);font-size:10px">
              ${(f.reason||"데이터 없음").slice(0,32)}</td></tr>`;
    }
    const chg = f.chg_pct==null ? "-" :
      `<span class="${f.chg_pct>=0?'up':'dn'}">${f.chg_pct>=0?'+':''}${f.chg_pct.toFixed(2)}%</span>`;
    return `<tr>
      <td>${f.tf}</td>
      <td>${chg}</td>
      <td>${f.above_ma20==null?'-':(f.above_ma20?'<span class="up">위</span>':'<span class="dn">아래</span>')}</td>
      <td>${f.rsi==null?'-':f.rsi.toFixed(0)}</td>
      <td><span class="vd ${cls(f.verdict)}">${f.verdict}</span></td>
    </tr>`;
  }).join("");

  const ok = d.frames.filter(f=>f.available);
  const agree = ok.length && ok.every(f=>f.verdict===ok[0].verdict) ? ok[0].verdict : null;
  meta.innerHTML = agree ? `<span class="vd ${cls(agree)}">${agree} 일치</span>` : "";

  body.innerHTML = `<table id="mtf-table">
      <tr><th>TF</th><th>등락</th><th>MA20</th><th>RSI</th><th>판정</th></tr>${rows}
    </table>
    <div class="muted-note">판정 = MA20·RSI·스퀴즈 3지표 합산(±3). 분봉은 KIS, 일봉은 KRX.</div>`;
}

// ---- 우측: 포워드 컨센서스 ----
const eok = (v) => {           // 억원 -> 읽기 쉬운 표기
  if (v === null || v === undefined) return "-";
  const a = Math.abs(v);
  if (a >= 10000) return (v/10000).toFixed(1) + "조";
  return Math.round(v).toLocaleString() + "억";
};
const num = (v, d=2) => (v === null || v === undefined) ? "-" : v.toFixed(d);

function renderEstimates(est, lastClose){
  const body = $("#est-body"), meta = $("#est-meta");
  if (!est || !est.available){
    meta.textContent = "";
    body.innerHTML = `<div class="muted-note">${est?.reason || "데이터 없음"}</div>`;
    return;
  }
  const opCls = /매수|Buy|강력/.test(est.opinion||"") ? "buy" : "hold";
  const ed = est.est_date ? `${est.est_date.slice(0,4)}-${est.est_date.slice(4,6)}-${est.est_date.slice(6)}` : "-";
  meta.innerHTML = est.opinion ? `<span class="op ${opCls}">${est.opinion}</span>` : "";

  // 미국은 백만달러, 국내는 억원. 단위가 달라 포맷터를 분기한다.
  const isUsd = (est.unit === "백만달러");
  const usd = (v) => {                 // 백만달러 -> $B / $M
    if (v === null || v === undefined) return "-";
    const a = Math.abs(v);
    if (a >= 1000) return "$" + (v/1000).toFixed(1) + "B";
    return "$" + Math.round(v).toLocaleString() + "M";
  };
  const amt = isUsd ? usd : eok;

  const rows = est.rows.map(r=>`
    <tr class="${r.is_estimate?'est':''}">
      <td>${r.period}${r.analysts?`<span class="sub"> ·${Math.round(r.analysts)}</span>`:""}</td>
      <td>${amt(r.revenue)}</td>
      <td>${amt(r.op_profit)}</td>
      <td>${r.op_margin === null || r.op_margin === undefined ? "-" : num(r.op_margin,1)+"%"}</td>
      <td>${num(r.per,1)}</td>
      <td>${num(r.pbr,2)}</td>
    </tr>`).join("");

  // 추정 구간 요약. 미국은 포워드 PBR 이 없어(추정 BPS 부재) EPS 로 대체한다.
  const e1 = est.rows.find(r=>r.is_estimate);
  const tile = (label, val) => `
      <div style="flex:1;background:#1b2432;border-radius:6px;padding:6px 8px">
        <div class="sub">${label}</div>
        <div style="font-size:16px;font-weight:600;color:var(--accent)">${val}</div>
      </div>`;
  const summary = e1 ? `
    <div style="display:flex;gap:8px;margin:8px 0 6px">
      ${tile(`${e1.period} PER`, num(e1.per,1) + "배")}
      ${e1.pbr !== null && e1.pbr !== undefined
        ? tile(`${e1.period} PBR`, num(e1.pbr,2) + "배")
        : tile(`${e1.period} EPS`, e1.eps ? "$" + num(e1.eps,2) : "-")}
    </div>` : "";

  // 목표주가 · 컨센서스 리비전 (미국 경로에서만 제공)
  const tg = est.targets;
  const extra = tg ? `
    <div class="muted-note">
      목표주가 평균 $${Math.round(tg.mean).toLocaleString()}
      (중위 $${Math.round(tg.median).toLocaleString()} · 최고 $${Math.round(tg.high).toLocaleString()} · 최저 $${Math.round(tg.low).toLocaleString()})
      ${est.price ? ` · 현재가 대비 ${((tg.mean/est.price-1)*100).toFixed(0)}%` : ""}
    </div>` : "";
  const rv = est.eps_revisions;
  const revLine = (rv && rv.current) ? `
    <div class="muted-note">
      차기연도 EPS 컨센서스: 90일전 ${num(rv["90daysAgo"],2)} → 30일전 ${num(rv["30daysAgo"],2)} → 현재 ${num(rv.current,2)}
    </div>` : "";

  body.innerHTML = summary + `
    <table id="est-table">
      <tr><th>기간</th><th>매출</th><th>영업익</th><th>OPM</th><th>PER</th><th>PBR</th></tr>
      ${rows}
    </table>` + extra + revLine + `
    <div class="muted-note">
      ${est.source === "FnGuide"
        ? `출처 FnGuide · 현재가 ${est.price ? Number(est.price).toLocaleString() : "-"}원${est.price_date?` (${est.price_date})`:""}`
        : est.source === "yfinance+SEC"
        ? `출처 실적 SEC EDGAR · 추정 yfinance · 현재가 $${est.price ? Number(est.price).toFixed(2) : "-"}${est.price_date?` (${est.price_date})`:""}${est.opinion?` · ${est.opinion}`:""}`
        : `출처 KIS · 시총 ${eok(est.mktcap_eok)} · 자본 ${eok(est.equity_eok)} · 추정일 ${ed}${est.analyst?` · ${est.analyst}`:""}`}
    </div>
    <div class="muted-note">${est.pbr_note}</div>
    <div class="warn">
      ⚠️ <b>E 행은 증권사 추정치</b>입니다. 실적이 아니며 컨센서스는 자주 바뀝니다.
      ${est.source === "FnGuide"
        ? "E 행 배수는 현재가 ÷ 컨센서스 EPS·BPS 이고, 실적 연도는 결산기일 주가 기준입니다."
        : est.source === "yfinance+SEC"
        ? "E 행 PER 은 현재가 ÷ 컨센서스 EPS 입니다. 회사 제시 가이던스가 아니라 애널리스트 추정입니다."
        : "포워드 배수는 현재 시가총액 ÷ 추정치입니다."}
      추정이 틀리면 배수도 틀립니다. 숫자가 이례적이면 원자료(리포트)를 직접 확인하세요.
    </div>`;
}

// ---- 로딩 진행률 ----
// 화면 하나가 완성되려면 /full · /signals · /bands · /mtf 네 요청이 끝나야 한다.
// 단일 HTTP 요청의 실제 바이트 진행률은 알 수 없으므로 '완료한 요청 수 / 전체'를
// 퍼센트로 보여준다. 반쯤 빈 패널을 보여주는 것보다 낫다.
// 단계를 이름으로 추적한다. 같은 단계가 두 번 완료되어도(캐시 히트로 즉시
// 끝나거나 버튼이 재호출) 진행률이 앞질러 100% 가 되지 않는다.
const PROG_STEPS = ["full", "signals", "bands", "mtf"];
const PROG = {done: new Set(), active:false};
function progStart(){ PROG.done.clear(); PROG.active = true; progPaint(); }
function progStep(name){
  if(!PROG.active) return;
  PROG.done.add(name);
  if(PROG.done.size >= PROG_STEPS.length) PROG.active = false;
  progPaint();
}
function progPaint(){
  const el = $("#loading");
  if(!el) return;
  if(!PROG.active){ el.style.display = "none"; el.textContent = ""; return; }
  el.style.display = "block";
  const pending = PROG_STEPS.filter(s=>!PROG.done.has(s));
  el.textContent = `데이터 가져오는 중… ${Math.round(PROG.done.size / PROG_STEPS.length * 100)}%`
                 + (pending.length ? ` (남음: ${pending.join(", ")})` : "");
}

// ---- API ----
async function loadTicker(code){
  hideBanner();
  CUR_TICKER = code;
  progStart();
  try{
    const r = await fetch(`${API_BASE}/api/chart/full?ticker=${code}&days=${PERIOD}&tf=${TF}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    progStep("full");
    render(d);                    // render 안에서 signals/bands/mtf 를 이어 띄운다
    if (d.trading && !d.trading.available)
      showBanner("⚠ 수급 데이터 비활성: " + d.trading.reason);
  }catch(e){
    showBanner("API 연결 실패 — 더미 데이터 미리보기 (" + e.message + ")");
    PROG.active = false; progPaint();
    render(dummy());
  }
}

// ---- 봉 / 기간 전환 ----
document.querySelectorAll(".tfb").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tfb").forEach(x=>x.classList.toggle("on",x===b));
  TF=b.dataset.tf; if(CUR_TICKER) loadTicker(CUR_TICKER);
}));
document.querySelectorAll(".pdb").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".pdb").forEach(x=>x.classList.toggle("on",x===b));
  PERIOD=+b.dataset.d; if(CUR_TICKER) loadTicker(CUR_TICKER);   // 밴드도 같은 구간으로 다시 그려진다
}));

// ---- 검색 (디바운스) ----
let timer = null;
$("#q").addEventListener("input", (e)=>{
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 1){ $("#dropdown").style.display="none"; return; }
  timer = setTimeout(async ()=>{
    try{
      const r = await fetch(`${API_BASE}/api/chart/search?q=${encodeURIComponent(q)}&limit=15`);
      const d = await r.json();
      const dd = $("#dropdown");
      if(!d.results || !d.results.length){ dd.style.display="none"; return; }
      dd.innerHTML = d.results.map(x=>
        `<div data-code="${x.code}"><span>${x.name}</span><span class="mk">${x.code} · ${x.market}</span></div>`
      ).join("");
      dd.style.display="block";
      dd.querySelectorAll("div[data-code]").forEach(el=>{
        el.addEventListener("click", ()=>{
          $("#q").value = el.querySelector("span").textContent;
          dd.style.display="none";
          loadTicker(el.dataset.code);
        });
      });
    }catch(err){ $("#dropdown").style.display="none"; }
  }, 250);
});
document.addEventListener("click",(e)=>{
  if(!e.target.closest(".searchbox")) $("#dropdown").style.display="none";
});

// ---- 더미 폴백 (API 실패 시 미리보기) ----
function dummy(){
  const N=220, dates=[], open=[],high=[],low=[],close=[],volume=[];
  let px=50000; const start=new Date("2025-01-02");
  for(let i=0;i<N;i++){
    const dt=new Date(start.getTime()+i*86400000);
    if(dt.getDay()===0||dt.getDay()===6) continue;
    px = px*(1+ (Math.sin(i/18)*0.012) + (Math.random()-0.5)*0.02);
    const o1=px*(1+(Math.random()-0.5)*0.006), c1=px;
    const h1=Math.max(o1,c1)*(1+Math.random()*0.01), l1=Math.min(o1,c1)*(1-Math.random()*0.01);
    dates.push(dt.toISOString().slice(0,10));
    open.push(+o1.toFixed(0)); high.push(+h1.toFixed(0));
    low.push(+l1.toFixed(0)); close.push(+c1.toFixed(0));
    volume.push(Math.floor(1e6+Math.random()*4e6));
  }
  const sma=(a,n)=>a.map((_,i)=> i<n-1?null: a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
  const s20=sma(close,20);
  const std=close.map((_,i)=> i<19?null:Math.sqrt(close.slice(i-19,i+1)
      .reduce((s,v)=>s+Math.pow(v-s20[i],2),0)/20));
  return {
    name:"(더미) 미리보기", ticker:"------", market:"-",
    ohlcv:{dates,open,high,low,close,volume},
    indicators:{
      sma20:s20, sma50:sma(close,50), sma120:sma(close,120),
      bb_upper:s20.map((v,i)=>v===null?null:v+2*std[i]),
      bb_lower:s20.map((v,i)=>v===null?null:v-2*std[i]),
      rsi:close.map((_,i)=> i<14?null: 50+30*Math.sin(i/12)),
      squeeze:{val:close.map((_,i)=> i<20?null: 800*Math.sin(i/9)),
               color:close.map((_,i)=> i<20?null: (Math.sin(i/9)>=0?"#2dd4bf":"#f43f5e"))},
      rsi_bear_div:[], patterns:[], zigzag:[]
    },
    trading:{available:false, reason:"더미 모드"}
  };
}

// 초기 로드: 삼성전자
loadTicker("005930");
</script>

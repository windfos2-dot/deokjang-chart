<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>덕장 차트</title>
<!-- lightweight-charts 4.x
     ※ 지시서는 cdnjs를 지정했으나 cdnjs에는 이 라이브러리가 존재하지 않는다
       (api.cdnjs.com -> "Library not found", 실측 2026-07-28).
       검증된 jsdelivr을 주 소스로, unpkg를 폴백으로 사용한다. -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  if (typeof LightweightCharts === "undefined") {
    document.write('<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#0d1117; --panel:#131a24; --border:#243040; --text:#e6edf3;
    --muted:#8b98a9; --up:#e2445c; --down:#3b82f6; --accent:#2dd4bf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;
         border-bottom:1px solid var(--border);background:var(--panel);
         position:sticky;top:0;z-index:50;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
  .searchbox{position:relative;flex:1;min-width:220px;max-width:380px}
  #q{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);
     background:#0b0f16;color:var(--text);font-size:14px;outline:none}
  #q:focus{border-color:var(--accent)}
  #dropdown{position:absolute;top:110%;left:0;right:0;background:var(--panel);
            border:1px solid var(--border);border-radius:8px;max-height:320px;
            overflow-y:auto;display:none;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  #dropdown div{padding:9px 12px;cursor:pointer;font-size:13px;display:flex;
                justify-content:space-between;gap:10px}
  #dropdown div:hover{background:#1b2432}
  .mk{color:var(--muted);font-size:11px}
  #meta{font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  #meta b{color:var(--text);font-size:15px}
  .chg.up{color:var(--up)} .chg.down{color:var(--down)}
  #banner{display:none;padding:8px 18px;background:#3b2a12;color:#f5c77e;
          font-size:12.5px;border-bottom:1px solid #5a4320}
  main{padding:10px 14px 40px; margin-right:330px}
  @media (max-width:1100px){ main{margin-right:0} #side{position:static;width:auto;height:auto} }
  #side{position:fixed; right:0; top:0; width:320px; height:100vh; overflow-y:auto;
        background:var(--panel); border-left:1px solid var(--border); padding:12px;
        z-index:40; font-size:12px}
  #side h3{font-size:12.5px;margin:0 0 8px;color:var(--text);font-weight:600;
           display:flex;justify-content:space-between;align-items:center;gap:6px}
  #side .sub{color:var(--muted);font-size:11px;font-weight:400}
  #est-table{width:100%;border-collapse:collapse;font-size:11px}
  #est-table th,#est-table td{padding:4px 5px;text-align:right;border-bottom:1px solid #1b2432;
                              white-space:nowrap}
  #est-table th{color:var(--muted);font-weight:500}
  #est-table td:first-child,#est-table th:first-child{text-align:left}
  #est-table tr.est{background:rgba(45,212,191,.07)}
  #est-table tr.est td:first-child{color:var(--accent);font-weight:600}
  #mtf-table{width:100%;border-collapse:collapse;font-size:11px}
  #mtf-table th,#mtf-table td{padding:5px;text-align:right;border-bottom:1px solid #1b2432;white-space:nowrap}
  #mtf-table th{color:var(--muted);font-weight:500}
  #mtf-table td:first-child,#mtf-table th:first-child{text-align:left;font-weight:600}
  .vd{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:600}
  .vd.bull{background:#0f3f33;color:#4ade80}
  .vd.bear{background:#3f1620;color:#f87171}
  .vd.flat{background:#26303f;color:#9aa7b8}
  .btngroup{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden}
  .tfb,.pdb,.bm,.bb,.by{background:#0e131c;color:var(--muted);border:0;padding:3px 8px;
              font-size:11px;cursor:pointer;font-family:inherit}
  .tfb+.tfb,.pdb+.pdb,.bm+.bm,.bb+.bb,.by+.by{border-left:1px solid var(--border)}
  .tfb.on,.pdb.on,.bm.on,.bb.on,.by.on{background:var(--accent);color:#06231f;font-weight:600}
  .tfb:hover:not(.on),.pdb:hover:not(.on),.bm:hover:not(.on),.bb:hover:not(.on),.by:hover:not(.on){background:#1b2432;color:var(--text)}
  #sig-table{width:100%;border-collapse:collapse;font-size:11px}
  #sig-table td,#sig-table th{padding:4px 5px;border-bottom:1px solid #1b2432;white-space:nowrap}
  #sig-table th{color:var(--muted);font-weight:500;text-align:right}
  #sig-table td:first-child,#sig-table th:first-child{text-align:left;font-weight:600}
  #sig-table td:not(:first-child){text-align:right}
  .lamp{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
  .lamp.green{background:#22c55e;box-shadow:0 0 6px #22c55e88}
  .lamp.yellow{background:#facc15;box-shadow:0 0 6px #facc1588}
  .lamp.red{background:#f87171;box-shadow:0 0 6px #f8717188}
  .sechead{color:var(--muted);font-size:10.5px;margin:8px 0 3px}
  .up{color:#f87171} .dn{color:#60a5fa}
  .op{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;font-weight:600}
  .op.buy{background:#0f3f33;color:#4ade80} .op.hold{background:#3a3320;color:#f0c674}
  .warn{margin-top:8px;padding:7px 8px;border-radius:6px;background:#3b2a12;
        color:#f5c77e;font-size:10.5px;line-height:1.45}
  .muted-note{color:var(--muted);font-size:10.5px;margin-top:6px;line-height:1.4}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;
         margin-bottom:10px;overflow:hidden}
  .ptitle{font-size:12px;color:var(--muted);padding:7px 12px;border-bottom:1px solid var(--border);
          display:flex;justify-content:space-between;align-items:center}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px}
  .legend i{display:inline-block;width:9px;height:2.5px;vertical-align:middle;margin-right:4px}
  .off{opacity:.45}
  #patterns{font-size:11.5px;color:var(--muted);padding:0 4px 6px}
  .tag{display:inline-block;background:#1b2432;border:1px solid var(--border);
       border-radius:5px;padding:2px 7px;margin:3px 4px 0 0;color:#c9d4e2}
  #toggles{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
  #toggles label{font-size:11.5px;background:#1b2432;border:1px solid var(--border);
       border-radius:6px;padding:4px 9px;cursor:pointer;user-select:none;color:#c9d4e2}
  #toggles input{margin-right:5px;vertical-align:-1px}
  #mnv{font-size:12px;padding:6px 14px 0;color:var(--muted)}
  .badge{display:inline-block;border-radius:5px;padding:2px 8px;font-weight:600;font-size:11.5px}
  .badge.ok{background:#0f3f33;color:#4ade80;border:1px solid #17614e}
  .badge.no{background:#3f1620;color:#fb7185;border:1px solid #6d2436}
  .crit{display:inline-block;margin:2px 3px 0 0;font-size:11px;padding:1px 6px;
        border-radius:4px;border:1px solid var(--border)}
  .crit.y{color:#4ade80} .crit.n{color:#fb7185} .crit.na{color:#6b7684}
</style>
</head>
<body>

<header>
  <h1>덕장 차트</h1>
  <div class="searchbox">
    <input id="q" placeholder="종목명 또는 코드 (예: 삼성전자, 005930)" autocomplete="off" />
    <div id="dropdown"></div>
  </div>
  <div id="meta"></div>
</header>

<div id="banner"></div>

<div id="toggles">
  <span class="btngroup"><button class="tfb on" data-tf="D">일봉</button><button class="tfb" data-tf="W">주봉</button><button class="tfb" data-tf="M">월봉</button></span>
  <span class="btngroup"><button class="pdb" data-d="250">1년</button><button class="pdb on" data-d="750">3년</button><button class="pdb" data-d="1250">5년</button><button class="pdb" data-d="2600">10년</button><button class="pdb" data-d="5200">20년</button></span>
  <label><input type="checkbox" id="t-ma" checked>이동평균(5·10·20·50·120)</label>
  <label><input type="checkbox" id="t-bb" checked>볼린저(20,2)</label>
  <label><input type="checkbox" id="t-hma" checked>HMA(60)</label>
  <label><input type="checkbox" id="t-ich">이치모쿠(9,26,52)</label>
  <label><input type="checkbox" id="t-pat" checked>ACP 패턴</label>
  <label><input type="checkbox" id="t-sr" checked>S/R + 돌파</label>
  <label><input type="checkbox" id="t-ob">오더블록</label>
  <label><input type="checkbox" id="t-div" checked>RSI 다이버전스</label>
</div>
<div id="mnv"></div>

<main>
  <div class="panel">
    <div class="ptitle">
      <span>가격 · 이동평균 · 볼린저 · 패턴</span>
      <span class="legend">
        <span style="color:#f0b90b"><i style="background:#f0b90b"></i>MA20</span>
        <span style="color:#9b6dff"><i style="background:#9b6dff"></i>MA50</span>
        <span style="color:#26a69a"><i style="background:#26a69a"></i>MA120</span>
        <span style="color:#5d6d7e"><i style="background:#5d6d7e"></i>BB(20,2)</span>
      </span>
    </div>
    <div id="main-chart" style="height:420px"></div>
    <div id="patterns"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>거래량</span></div>
    <div id="vol-chart" style="height:110px"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>RSI(14) · Bear 다이버전스 ▼</span></div>
    <div id="rsi-chart" style="height:140px"></div>
  </div>

  <div class="panel">
    <div class="ptitle"><span>스퀴즈 모멘텀 (LazyBear)</span></div>
    <div id="sqz-chart" style="height:140px"></div>
  </div>

  <div class="panel" id="aa-panel">
    <div class="ptitle"><span>스퀴즈 모멘텀 (AlgoAlpha)</span><span id="aa-note" class="mk"></span></div>
    <div id="aa-chart" style="height:150px"></div>
  </div>

  <div class="panel" id="flow-panel">
    <div class="ptitle"><span>수급 — 외국인 순매수</span><span id="flow-note" class="mk"></span></div>
    <div id="flow-chart" style="height:150px"></div>
  </div>

  <div class="panel" id="band-panel">
    <div class="ptitle">
      <span>역사적 밸류에이션 밴드
        <span class="btngroup" style="margin-left:8px">
          <button class="bm on" data-m="PER">PER</button><button class="bm" data-m="PBR">PBR</button><button class="bm" data-m="POR">POR</button><button class="bm" data-m="ROE">ROE</button>
        </span>
        <span class="btngroup" style="margin-left:6px">
          <button class="bb on" data-b="FY">FY확정</button><button class="bb" data-b="LTM">LTM</button>
        </span>
        <span class="btngroup" style="margin-left:6px">
          <button class="by" data-y="1">1년</button><button class="by" data-y="3">3년</button><button class="by on" data-y="5">5년</button><button class="by" data-y="10">10년</button>
        </span>
      </span>
      <span id="band-note" class="mk"></span>
    </div>
    <div id="band-chart" style="height:200px"></div>
  </div>

  <div class="panel" id="short-panel">
    <div class="ptitle"><span>공매도 잔고 (수량 / 비중%)</span><span id="short-note" class="mk"></span></div>
    <div id="short-chart" style="height:140px"></div>
  </div>
</main>

<aside id="side">
  <h3>신호등 <span class="sub" id="sig-meta"></span></h3>
  <div id="sig-body"><div class="muted-note">종목을 선택하세요</div></div>
  <div style="height:14px"></div>
  <h3>멀티타임프레임 <span class="sub" id="mtf-meta"></span></h3>
  <div id="mtf-body"><div class="muted-note">불러오는 중…</div></div>
  <div style="height:14px"></div>
  <h3>포워드 컨센서스 <span class="sub" id="est-meta"></span></h3>
  <div id="est-body"><div class="muted-note">불러오는 중…</div></div>
</aside>

<script>
// ===== EMS 주소 주입 =====
const API_BASE = window.location.origin;   // 예: "http://ems.example.com"

const $ = (s) => document.querySelector(s);
const banner = $("#banner");
function showBanner(msg){ banner.textContent = msg; banner.style.display = "block"; }
function hideBanner(){ banner.style.display = "none"; }

const COMMON = {
  layout:{ background:{ color:"#131a24" }, textColor:"#8b98a9", fontSize:11 },
  grid:{ vertLines:{ color:"#1b2432" }, horzLines:{ color:"#1b2432" } },
  rightPriceScale:{ borderColor:"#243040" },
  timeScale:{ borderColor:"#243040", rightOffset:6 },
  crosshair:{ mode:0 },
};

const mainChart = LightweightCharts.createChart($("#main-chart"), {...COMMON, height:420});
const volChart  = LightweightCharts.createChart($("#vol-chart"),  {...COMMON, height:110});
const rsiChart  = LightweightCharts.createChart($("#rsi-chart"),  {...COMMON, height:140});
const sqzChart  = LightweightCharts.createChart($("#sqz-chart"),  {...COMMON, height:140});
const aaChart = LightweightCharts.createChart($("#aa-chart"), {...COMMON, height:150});
const flowChart = LightweightCharts.createChart($("#flow-chart"), {...COMMON, height:150});
const shortChart = LightweightCharts.createChart($("#short-chart"), {...COMMON, height:140});
// 밴드는 회계 기준 시계열이라 다른 패널과 시간축을 공유하지 않는다
const bandChart = LightweightCharts.createChart($("#band-chart"), {...COMMON, height:200});
const CHARTS = [mainChart, volChart, rsiChart, sqzChart, aaChart, flowChart, shortChart];

// 시리즈
const candle = mainChart.addCandlestickSeries({
  upColor:"#e2445c", downColor:"#3b82f6", borderVisible:false,
  wickUpColor:"#e2445c", wickDownColor:"#3b82f6",
});
const mkLine = (o) => mainChart.addLineSeries(
  Object.assign({lineWidth:1, priceLineVisible:false, lastValueVisible:false,
                 crosshairMarkerVisible:false}, o));

const ma5   = mkLine({color:"#8b98a9"});
const ma10  = mkLine({color:"#c58fff"});
const ma20  = mkLine({color:"#f0b90b"});
const ma50  = mkLine({color:"#9b6dff"});
const ma120 = mkLine({color:"#26a69a"});
const hma60 = mkLine({color:"#38bdf8", lineWidth:2});
const bbU   = mkLine({color:"#5d6d7e", lineStyle:2});
const bbL   = mkLine({color:"#5d6d7e", lineStyle:2});
// 이치모쿠
const ichTen = mkLine({color:"#ef4444"});
const ichKij = mkLine({color:"#3b82f6"});
const ichA   = mkLine({color:"rgba(34,197,94,.85)"});
const ichB   = mkLine({color:"rgba(239,68,68,.6)"});
const ichChi = mkLine({color:"#a3a3a3", lineStyle:1});
// S/R (LuxAlgo 계단선)
const srHi = mkLine({color:"#e2445c", lineWidth:2, lineStyle:0});
const srLo = mkLine({color:"#3b82f6", lineWidth:2, lineStyle:0});

const MA_SERIES  = [ma5, ma10, ma20, ma50, ma120];
const BB_SERIES  = [bbU, bbL];
const ICH_SERIES = [ichTen, ichKij, ichA, ichB, ichChi];
const SR_SERIES  = [srHi, srLo];
const volSeries  = volChart.addHistogramSeries({priceFormat:{type:"volume"}});
const rsiSeries  = rsiChart.addLineSeries({color:"#e6edf3", lineWidth:1, priceLineVisible:false});
const sqzSeries  = sqzChart.addHistogramSeries({priceLineVisible:false});
// AlgoAlpha: vf(모멘텀 라인) + zscore(백색) + 스퀴즈 상태 점
const aaVf = aaChart.addLineSeries({lineWidth:2, priceLineVisible:false});
const aaZ  = aaChart.addLineSeries({color:"#e8ecf1", lineWidth:1, priceLineVisible:false});
const aaSq = aaChart.addHistogramSeries({priceLineVisible:false, lastValueVisible:false});
const flowSeries = flowChart.addHistogramSeries({priceLineVisible:false});
const shortQty = shortChart.addAreaSeries({
  topColor:"rgba(226,68,92,.35)", bottomColor:"rgba(226,68,92,.02)",
  lineColor:"#e2445c", lineWidth:1, priceLineVisible:false});
const shortRatio = shortChart.addLineSeries({
  color:"#f0b90b", lineWidth:1, priceScaleId:"right2",
  priceLineVisible:false, lastValueVisible:true});
shortChart.priceScale("right2").applyOptions({scaleMargins:{top:.1,bottom:.1}});

rsiSeries.createPriceLine({price:70, color:"#e2445c", lineWidth:1, lineStyle:2, axisLabelVisible:false});
rsiSeries.createPriceLine({price:30, color:"#3b82f6", lineWidth:1, lineStyle:2, axisLabelVisible:false});
sqzSeries.createPriceLine({price:0, color:"#5d6d7e", lineWidth:1, lineStyle:0, axisLabelVisible:false});
flowSeries.createPriceLine({price:0, color:"#5d6d7e", lineWidth:1, lineStyle:0, axisLabelVisible:false});

// 시간축 동기화
let syncing = false;
CHARTS.forEach((c) => {
  c.timeScale().subscribeVisibleLogicalRangeChange((range) => {
    if (syncing || !range) return;
    syncing = true;
    CHARTS.forEach((o) => { if (o !== c) o.timeScale().setVisibleLogicalRange(range); });
    syncing = false;
  });
});

window.addEventListener("resize", () => {
  CHARTS.forEach((c) => c.applyOptions({ width: c._el ? c._el.clientWidth : undefined }));
  mainChart.applyOptions({width: $("#main-chart").clientWidth});
  volChart.applyOptions({width: $("#vol-chart").clientWidth});
  rsiChart.applyOptions({width: $("#rsi-chart").clientWidth});
  sqzChart.applyOptions({width: $("#sqz-chart").clientWidth});
  aaChart.applyOptions({width: $("#aa-chart").clientWidth});
  flowChart.applyOptions({width: $("#flow-chart").clientWidth});
  shortChart.applyOptions({width: $("#short-chart").clientWidth});
  bandChart.applyOptions({width: $("#band-chart").clientWidth});
});

// 동적 시리즈 (패턴 추세선 / 오더블록 박스)
let patternSeries = [], obSeries = [];
let CUR_TICKER = null;
let PERIOD = 750;      // 서버에서 받아올 일봉 수 (3년)
let TF = "D";          // D=일봉 W=주봉 M=월봉
let RAW = null;        // 서버 원본 (재집계 전)

async function loadTicker(code){
  hideBanner();
  CUR_TICKER = code;
  try{
    // 로컬 서버는 온디맨드라 기간을 늘려도 호출 1회다(OHLCV 10년 ≈ 0.1초).
    const r = await fetch(`${API_BASE}/api/chart/full?ticker=${code}&days=${PERIOD}&tf=${TF}`);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    RAW = d;
    render(d);
    if (d.trading && !d.trading.available)
      showBanner("⚠ 수급 데이터 비활성: " + d.trading.reason);
  }catch(e){
    showBanner("API 연결 실패 — 더미 데이터 미리보기 (" + e.message + ")");
    render(dummy());
  }
}

// ---- 봉 / 기간 전환 ----
document.querySelectorAll(".tfb").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tfb").forEach(x=>x.classList.toggle("on",x===b));
  TF=b.dataset.tf; if(CUR_TICKER) loadTicker(CUR_TICKER);
}));
document.querySelectorAll(".pdb").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".pdb").forEach(x=>x.classList.toggle("on",x===b));
  PERIOD=+b.dataset.d; if(CUR_TICKER) loadTicker(CUR_TICKER);
}));

// ---- 검색 (디바운스) ----
let timer = null;
$("#q").addEventListener("input", (e)=>{
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (q.length < 1){ $("#dropdown").style.display="none"; return; }
  timer = setTimeout(async ()=>{
    try{
      const r = await fetch(`${API_BASE}/api/chart/search?q=${encodeURIComponent(q)}&limit=15`);
      const d = await r.json();
      const dd = $("#dropdown");
      if(!d.results || !d.results.length){ dd.style.display="none"; return; }
      dd.innerHTML = d.results.map(x=>
        `<div data-code="${x.code}"><span>${x.name}</span><span class="mk">${x.code} · ${x.market}</span></div>`
      ).join("");
      dd.style.display="block";
      dd.querySelectorAll("div[data-code]").forEach(el=>{
        el.addEventListener("click", ()=>{
          $("#q").value = el.querySelector("span").textContent;
          dd.style.display="none";
          loadTicker(el.dataset.code);
        });
      });
    }catch(err){ $("#dropdown").style.display="none"; }
  }, 250);
});
document.addEventListener("click",(e)=>{

// ---- 더미 폴백 (API 실패 시 미리보기) ----
function dummy(){
  const N=220, dates=[], open=[],high=[],low=[],close=[],volume=[];
  let px=50000; const start=new Date("2025-01-02");
  for(let i=0;i<N;i++){
    const dt=new Date(start.getTime()+i*86400000);
    if(dt.getDay()===0||dt.getDay()===6) continue;
    px = px*(1+ (Math.sin(i/18)*0.012) + (Math.random()-0.5)*0.02);
    const o1=px*(1+(Math.random()-0.5)*0.006), c1=px;
    const h1=Math.max(o1,c1)*(1+Math.random()*0.01), l1=Math.min(o1,c1)*(1-Math.random()*0.01);
    dates.push(dt.toISOString().slice(0,10));
    open.push(+o1.toFixed(0)); high.push(+h1.toFixed(0));
    low.push(+l1.toFixed(0)); close.push(+c1.toFixed(0));
    volume.push(Math.floor(1e6+Math.random()*4e6));
  }
  const sma=(a,n)=>a.map((_,i)=> i<n-1?null: a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
  const s20=sma(close,20);
  const std=close.map((_,i)=> i<19?null:Math.sqrt(close.slice(i-19,i+1)
      .reduce((s,v)=>s+Math.pow(v-s20[i],2),0)/20));
  return {
    name:"(더미) 미리보기", ticker:"------", market:"-",
    ohlcv:{dates,open,high,low,close,volume},
    indicators:{
      sma20:s20, sma50:sma(close,50), sma120:sma(close,120),
      bb_upper:s20.map((v,i)=>v===null?null:v+2*std[i]),
      bb_lower:s20.map((v,i)=>v===null?null:v-2*std[i]),
      rsi:close.map((_,i)=> i<14?null: 50+30*Math.sin(i/12)),
      squeeze:{val:close.map((_,i)=> i<20?null: 800*Math.sin(i/9)),
               color:close.map((_,i)=> i<20?null: (Math.sin(i/9)>=0?"#2dd4bf":"#f43f5e"))},
      rsi_bear_div:[], patterns:[], zigzag:[]
    },
    trading:{available:false, reason:"더미 모드"}
  };
}
